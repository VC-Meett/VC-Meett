<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title">
<title id="title">Less talk. More build.</title>
<defs><linearGradient id="outer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d7d0"/><stop offset=".5" stop-color="#8dcde9"/><stop offset="1" stop-color="#d7a7df"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71e1d9"/><stop offset=".5" stop-color="#8dcde9"/><stop offset="1" stop-color="#c6a3ea"/></linearGradient></defs>
<rect width="1200" height="150" rx="20" fill="url(#outer)"/><rect x="12" y="12" width="1176" height="126" rx="15" fill="#17191d" stroke="#dedfe9" stroke-opacity=".7"/>
<text x="42" y="61" fill="url(#wave)" font-family="Georgia,serif" font-size="58">“</text>
<text x="102" y="64" fill="#f0f3f6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="1">LESS TALK.</text>
<text x="102" y="101" fill="#f0f3f6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="1">MORE BUILD.</text>
<path d="M620 75 C665 75 666 45 695 45 S733 100 765 75 S810 32 839 68 S877 100 903 60 S940 54 967 75" fill="none" stroke="url(#wave)" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="695" cy="45" r="4" fill="#71e1d9"/><circle cx="839" cy="68" r="4" fill="#8dcde9"/><circle cx="903" cy="60" r="4" fill="#c6a3ea"/>
<text x="1150" y="66" fill="#d4b8ec" text-anchor="end" font-family="Georgia,serif" font-size="22" font-style="italic">Keep building.</text>
<text x="1150" y="97" fill="#848c99" text-anchor="end" font-family="monospace" font-size="11">CURIOSITY IN  →  USEFUL SOFTWARE OUT</text>
