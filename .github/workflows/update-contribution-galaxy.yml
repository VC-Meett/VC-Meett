name: Update contribution galaxy

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_galaxy.py"
      - ".github/workflows/update-contribution-galaxy.yml"

permissions:
  contents: write

jobs:
  update-galaxy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Generate galaxy from GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: VC-Meett
        run: python3 scripts/generate_galaxy.py
      - name: Commit updated visualization
        run: |
          if git diff --quiet -- assets/contribution-galaxy.svg; then
            echo "Contribution galaxy is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-galaxy.svg
          git commit -m "chore: refresh live contribution galaxy"
          git push
